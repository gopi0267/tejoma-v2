# Template for Tejoma microservice deployment
# Replace SERVICE_NAME with actual service name
# Usage: Use kustomize or helm to substitute placeholders

apiVersion: apps/v1
kind: Deployment
metadata:
  name: SERVICE_NAME
  namespace: tejoma
  labels:
    app: SERVICE_NAME
    component: microservice
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: SERVICE_NAME
  template:
    metadata:
      labels:
        app: SERVICE_NAME
        version: "1.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3006"
        prometheus.io/path: "/api/metrics"
    spec:
      serviceAccountName: tejoma-service

      # Init container to wait for dependencies
      initContainers:
        - name: wait-for-db
          image: busybox:1.35
          command: ['sh', '-c', 'until nc -z postgres.tejoma.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done;']

      containers:
        - name: SERVICE_NAME
          image: tejoma/SERVICE_NAME:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: SERVICE_PORT
              protocol: TCP
            - name: metrics
              containerPort: 3006
              protocol: TCP

          # Environment from ConfigMap
          envFrom:
            - configMapRef:
                name: tejoma-config

          # Service-specific env vars
          env:
            - name: DB_NAME
              value: tejoma_SERVICE_NAME
            - name: SERVICE_PORT
              value: "SERVICE_PORT"
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: tejoma-config
                  key: LOG_LEVEL
            # Secrets (DB password, API keys, etc.)
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tejoma-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: tejoma-secrets
                  key: jwt-secret
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: tejoma-secrets
                  key: gemini-api-key

          # Health checks
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

          # Resource limits
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # Security context
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          # Volume mounts for temp directories
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.cache

      # Volumes
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}

      # Pod-level security
      securityContext:
        fsGroup: 1000

      # Affinity rules
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - SERVICE_NAME
                topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: SERVICE_NAME
  namespace: tejoma
  labels:
    app: SERVICE_NAME
spec:
  type: ClusterIP
  selector:
    app: SERVICE_NAME
  ports:
    - name: http
      port: SERVICE_PORT
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 3006
      targetPort: metrics
      protocol: TCP

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: SERVICE_NAME-pdb
  namespace: tejoma
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: SERVICE_NAME
