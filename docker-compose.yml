name: tejoma

# Service-to-service URLs on the compose network.
#
# Every service loads .env.local via env_file, and .env.local is a HOST-oriented dev file - its
# *_SERVICE_URL values are all http://localhost:<port>, which is correct when you run a service
# directly on your machine and completely wrong inside a container, where localhost is that
# container itself. Each service's own `environment:` block overrode only two or three of these,
# so in the running stack most cross-service calls resolved to localhost and failed.
#
# Measured effect before this block existed: candidate-service could not reach job-service, so
# GET /api/candidate-decisions, /candidate-decisions/active and /candidate-applications returned
# rows with job_title/company_name/location all null ("fetch failed / jobs-by-ids" in its logs),
# and the gateway's own RESUME_SERVICE_URL pointed at resume-service:4007 where nothing listens,
# making /api/candidate-resume and /api/parse-resume unreachable.
#
# Ports below are the ports each container actually listens on, verified by probing /live on the
# compose network - NOT copied from .env.local. Merged into each service with `<<: *service-urls`
# ahead of that service's own keys, so a service can still override one deliberately.
x-service-urls: &service-urls
  IDENTITY_SERVICE_URL: http://identity-service:4001
  PLATFORM_GOVERNANCE_SERVICE_URL: http://platform-governance-service:4002
  TENANT_DIRECTORY_SERVICE_URL: http://tenant-directory-service:4003
  JD_PARSER_SERVICE_URL: http://jd-parser-service:4004
  CANDIDATE_SERVICE_URL: http://candidate-service:4005
  CHAT_SERVICE_URL: http://chat-service:4006
  RECRUITING_SERVICE_URL: http://recruiting-service:4009
  ANALYTICS_SERVICE_URL: http://analytics-service:4010
  MATCHING_EVALUATION_SERVICE_URL: http://matching-evaluation-service:4011
  MATCHING_REASONING_SERVICE_URL: http://matching-reasoning-service:4012
  MATCHING_SKILL_DISCOVERY_SERVICE_URL: http://matching-skill-discovery-service:4013
  MATCHING_BGE_SHADOW_SERVICE_URL: http://matching-bge-shadow-service:4014
  ROLE_INTELLIGENCE_SERVICE_URL: http://role-intelligence-service:4015
  CAREER_INTELLIGENCE_SERVICE_URL: http://career-intelligence-service:4016
  DYNAMIC_WEIGHTING_SERVICE_URL: http://dynamic-weighting-service:4017
  JOB_SERVICE_URL: http://job-service:4018
  CANDIDATE_CORE_SERVICE_URL: http://candidate-core-service:4019
  MATCHING_DECISION_SERVICE_URL: http://matching-decision-service:4020
  MATCHING_SCORING_SERVICE_URL: http://matching-scoring-service:4021
  REALTIME_SERVICE_URL: http://realtime-service:4030
  RESUME_SERVICE_URL: http://resume-service:4031
  # Python services. Previously set only on `app`, so every Node service that talks to them fell
  # back to its localhost default and could not reach them from inside its own container -
  # matching-evaluation-service's Learning-to-Rank trainer reported "Matching ML service
  # unavailable" for exactly this reason.
  MATCHING_ML_SERVICE_URL: http://matching-ml-service:8009
  JD_NLP_SERVICE_URL: http://jd-nlp-service:8008
  # MONOLITH_INTERNAL_URL / MONOLITH_URL removed with the monolith itself (decommissioned
  # 2026-08-12). Any service still holding a monolithClient now resolves an empty base URL and
  # fails fast rather than silently pointing at a host that no longer exists. Every such call
  # site is class B (rollback-only fire-and-forget mirrors) or dead code - all verified
  # non-blocking with runtime evidence before removal, see
  # TEJOMA_FINAL_MICROSERVICES_DECOMMISSION_REPORT.md.

networks:
  internal:
    driver: bridge

volumes:
  ml-models:
  hf-cache:
  prometheus-data:
  grafana-data:

services:
  # ============================================================================
  # APPLICATION SERVICES
  # ============================================================================

  # Phase D Item 2: Realtime service - handles SSE subscriptions via Redis pub/sub.
  # Receives /stream requests and maintains SSE connections, forwarding Redis messages to clients.
  # This removes SSE endpoint responsibility from the monolith.
  realtime-service:
    build:
      context: ./realtime-service
      dockerfile: Dockerfile
    environment:
      <<: *service-urls
      NODE_ENV: ${NODE_ENV:-production}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4030/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Final monolith decommission, item 1 - pub/sub backbone for decentralized real-time
  # notifications (item 2) and connection target for the already-coded-but-previously-inert
  # BullMQ retrain queue (src/queue/retrainQueue.ts, fail-open when unreachable - see its own
  # header comment). No persistence needed - both use cases are transient (in-flight pub/sub
  # messages, a small retrain job queue), never a system of record, so no volume is mounted.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  jd-nlp-service:
    build:
      context: ./python-services/jd-nlp-service
    volumes:
      # GLiNER's model downloads from HuggingFace on first startup (not baked into the image
      # like spaCy is) - this volume means that download only happens once, not on every
      # container recreate.
      - hf-cache:/home/tejoma/.cache/huggingface
    restart: unless-stopped
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  matching-ml-service:
    build:
      context: ./python-services/matching-ml-service
    volumes:
      - ml-models:/app/models
    restart: unless-stopped
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ============================================================================
  # TIER 0 MICROSERVICES
  # ============================================================================
  # All 19 share one pattern: native Postgres on the host (DB_HOST=host.docker.internal, same as
  # `app` above - Postgres itself is NOT containerized, see DEPLOYMENT.md), DB_USER/DB_PASSWORD/
  # JWT_SECRET/GEMINI_API_KEY inherited unchanged from .env.local via env_file (identical to how
  # `app` already does it). DB_NAME is explicitly overridden per service below - it must be, since
  # `env_file: .env.local` always resolves to the ROOT .env.local (Compose resolves env_file paths
  # relative to this file, never to a service's own build context), and that root file sets
  # DB_NAME=tejoma_recruiting for the monolith. Without an explicit override here, every one of
  # these services would silently inherit that value and connect to the monolith's own database
  # instead of its own - each service's own src/db.ts fallback default (e.g. `DB_NAME ||
  # 'tejoma_job'`) only ever applies when DB_NAME is completely unset, which it never is once
  # env_file has already supplied one. This was a real, previously-undetected bug across every
  # Tier 0 service in this file: /health only ever ran `SELECT 1`, which succeeds against any
  # reachable database, so it never caught services being connected to the wrong one - found by
  # testing an actual write against matching-scoring-service's real table, not by inspection.
  # Before first `docker-compose up`, each service's own database must exist and be migrated - see
  # MIGRATION_RUNBOOK.md's full-migration section: `npm run migrate` (from within each service
  # directory, against its real DB_NAME) then, for every dual-write mirror, `npx tsx
  # scripts/backfill-<service>.ts` from the repo root once real data exists to copy.

  identity-service:
    build:
      context: ./identity-service
    env_file:
      - .env.local
    environment:
      <<: *service-urls
      NODE_ENV: production
      DB_HOST: host.docker.internal
      DB_NAME: tejoma_identity
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4001/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  platform-governance-service:
