  resume-service:
    build:
      context: ./resume-service
    env_file:
      - .env.local
    environment:
      <<: *service-urls
      # resume-service owns tejoma_resume. Without this it inherited DB_NAME from .env.local,
      # which sets tejoma_recruiting for the (now decommissioned) monolith - so every
      # candidate_resume_files read/write targeted the monolith's database, where the table does
      # not exist. That is why candidate resume upload returned 500.
      DB_NAME: tejoma_resume
      NODE_ENV: production
      DB_HOST: host.docker.internal
      REDIS_URL: redis://redis:6379
      # Was http://app:3006 - the monolith, not upload-service. Left pointing at the real
      # upload-service now that the monolith is gone; resume-service's upload path was never
      # exercised against it, so this was latent rather than an active break.
      UPLOAD_SERVICE_URL: http://upload-service:4030
    depends_on:
      redis:
        condition: service_healthy
    volumes:
