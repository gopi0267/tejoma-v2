  # ============================================================================
  # API GATEWAY
  # ============================================================================
  # The real entry point once nginx is repointed at it (see nginx/conf.d/tejoma.conf's
  # tejoma_gateway upstream) - routes the ~19 paths already migrated to Tier 0 explicitly, falls
  # through to the monolith (MONOLITH_URL) for everything else, exactly as it always has. Depends
  # on every service it can route to directly, plus the monolith fallback, being healthy first.

  api-gateway:
    build:
      context: ./api-gateway
    env_file:
      - .env.local
    environment:
      <<: *service-urls
      NODE_ENV: production
      IDENTITY_SERVICE_URL: http://identity-service:4001
      PLATFORM_GOVERNANCE_SERVICE_URL: http://platform-governance-service:4002
      JD_PARSER_SERVICE_URL: http://jd-parser-service:4004
      CANDIDATE_SERVICE_URL: http://candidate-service:4005
      CHAT_SERVICE_URL: http://chat-service:4006
      # resume-service listens on 4031 (its Dockerfile EXPOSE), not 4007 - nothing has ever
      # listened on 4007, so /api/candidate-resume and /api/parse-resume both 502'd at the
      # gateway. Verified by probing both ports on the compose network.
      RESUME_SERVICE_URL: http://resume-service:4031
      RECRUITING_SERVICE_URL: http://recruiting-service:4009
      ANALYTICS_SERVICE_URL: http://analytics-service:4010
      MATCHING_EVALUATION_SERVICE_URL: http://matching-evaluation-service:4011
      MATCHING_SKILL_DISCOVERY_SERVICE_URL: http://matching-skill-discovery-service:4013
      MATCHING_SCORING_SERVICE_URL: http://matching-scoring-service:4021
      CANDIDATE_CORE_SERVICE_URL: http://candidate-core-service:4019
      JOB_SERVICE_URL: http://job-service:4018
      MATCHING_DECISION_SERVICE_URL: http://matching-decision-service:4020
    depends_on:
      identity-service:
        condition: service_healthy
      platform-governance-service:
        condition: service_healthy
      jd-parser-service:
        condition: service_healthy
      candidate-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      resume-service:
        condition: service_healthy
      recruiting-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      matching-evaluation-service:
        condition: service_healthy
      matching-skill-discovery-service:
        condition: service_healthy
      matching-scoring-service:
        condition: service_healthy
      candidate-core-service:
        condition: service_healthy
      job-service:
        condition: service_healthy
      matching-decision-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ============================================================================
  # REVERSE PROXY
  # ============================================================================

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      # nginx now proxies to api-gateway (tejoma_gateway upstream), not straight to `app` - see
      # nginx/conf.d/tejoma.conf's header comment. api-gateway itself depends on `app` (and every
      # other service it can route to) being healthy first, so this transitively still waits on
      # the monolith too.
      api-gateway:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./dist:/app/dist:ro
      - ./logs/nginx:/var/log/nginx
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Uncomment once a real domain points at this server, and swap the cert paths in
  # nginx/conf.d/tejoma.conf from the self-signed cert to /etc/letsencrypt/live/<domain>/ -
  # see DEPLOYMENT.md's HTTPS section for the exact one-time command to run this against.
  # certbot:
  #   image: certbot/certbot:latest
  #   volumes:
  #     - ./nginx/certbot/conf:/etc/letsencrypt
  #     - ./nginx/certbot/www:/var/www/certbot
  #   entrypoint: >
  #     sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

  # ============================================================================
  # MONITORING
  # ============================================================================

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - internal

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme_on_first_login}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - internal
    depends_on:
      - prometheus

  node-exporter:
    image: prom/node-exporter:latest
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    restart: unless-stopped
    networks:
      - internal

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    volumes:
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    restart: unless-stopped
    networks:
      - internal

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    # DB_USER/DB_PASSWORD/DB_PORT/DB_NAME here are resolved by Compose itself at parse time from
    # a root .env file (NOT from env_file:, which only injects into a running container) - copy
    # .env.local to .env once (see DEPLOYMENT.md) so these resolve correctly.
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER}:${DB_PASSWORD}@host.docker.internal:${DB_PORT}/${DB_NAME}?sslmode=disable"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - internal
