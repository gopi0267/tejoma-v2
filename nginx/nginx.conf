user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hides the Nginx version from error pages and the Server header.
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent" "$http_x_forwarded_for" rt=$request_time';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # Rate limit zone for the auth surface, complementing (not replacing) the app's own
    # express-rate-limit - a defense-in-depth layer in front of it.
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/s;
    # Rate-limited requests must answer 429 (Too Many Requests), not nginx's default 503.
    # 503 means "server unavailable" - it tells a client to back off for the wrong reason, and it
    # pollutes the 5xx error rate that alerting and SLO dashboards key on. Observed during load
    # testing: bursts against /api/auth/me showed up as 5xx and looked like server failures when
    # the rate limiter was in fact working exactly as designed.
    limit_req_status 429;

    include /etc/nginx/conf.d/*.conf;
}
