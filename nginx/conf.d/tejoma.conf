client_max_body_size 20m;

# Full-migration cutover: nginx now routes through API Gateway instead of straight to the
# monolith. The Gateway explicitly routes every path already migrated to a Tier 0 service (see
# api-gateway/src/proxy.ts's ROUTES table) and falls through to the monolith (MONOLITH_URL) for
# everything else - so this one upstream change is what actually activates every dual-write mirror
# and gateway-routed service built this migration, with zero change to any location block below.
#
# DNS RE-RESOLUTION (production availability fix):
# An `upstream { server api-gateway:4000; }` block resolves its hostname ONCE, at config load.
# Under Docker Compose a container gets a NEW IP every time it is recreated (`docker compose up
# -d --build api-gateway`), so nginx kept proxying to the dead pre-recreate IP and returned 502
# for EVERY /api/* request until someone manually reloaded nginx - a total API outage triggered
# by an ordinary service deploy. Observed in production: gateway recreated -> nginx held the
# stale IP -> whole application down.
#
# OSS nginx cannot re-resolve an `upstream` block's servers (the `resolve` parameter is nginx
# Plus only), so the upstreams below are expressed as VARIABLES instead: a proxy_pass whose
# target contains a variable is resolved per-request through `resolver`, which picks up the new
# container IP within `valid=10s`. Semantics are preserved exactly - $tejoma_gateway carries no
# URI part, so nginx forwards the full original request URI just as `proxy_pass
# http://tejoma_gateway;` did, and $realtime_service keeps its explicit `/stream` URI part so the
# location-prefix replacement is unchanged.
#
# Tradeoff: variable-based proxy_pass bypasses upstream keepalive pooling (a per-request
# connection setup to an in-network service). That cost is accepted deliberately - a few hundred
# microseconds per request in exchange for not taking the entire API surface down on every
# gateway deploy.
resolver 127.0.0.11 valid=10s ipv6=off;

# Re-resolved per request via the resolver above - see the header comment.
map $host $tejoma_gateway {
    default "http://api-gateway:4000";
}

# Phase D Item 2: Realtime service for SSE subscriptions (removed from monolith)
map $host $realtime_service {
    default "http://realtime-service:4030";
}

# ---------------------------------------------------------------------------
# Port 80: redirect everything to HTTPS, except the ACME challenge path used
# by the real Let's Encrypt flow later, and a plain health endpoint for the
# Docker HEALTHCHECK (doesn't need TLS, isn't sensitive).
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Port 443: TLS termination + reverse proxy to the Node app. Node already
# serves both the built SPA and /api/* from one process (unified deploy
# model), so this is a single upstream, not per-route splitting - no API
# routes are changed here, only proxied.
#
# Cert paths below are the self-signed dev cert generated by
# scripts/generate-dev-certs.sh. To switch to a real Let's Encrypt cert,
# point these two lines at /etc/letsencrypt/live/<domain>/fullchain.pem and
# privkey.pem instead (see DEPLOYMENT.md).
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Phase D Item 2: SSE endpoint now routed to dedicated realtime-service (removed from monolith).
    # Must not be buffered, and needs a long-lived connection.
    location /api/realtime/stream {
        proxy_pass $realtime_service/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1d;
        chunked_transfer_encoding off;
        add_header X-Accel-Buffering no;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Routes that hit Gemini or one of the Python microservices and can legitimately take
    # longer than a typical API call - extended timeouts so a slow (not stuck) upstream call
    # doesn't get cut off by the proxy before the app itself responds or times out.
    location ~ ^/api/(parse-resume|jobs/parse-description|ml/train|chat)$ {
        proxy_pass $tejoma_gateway;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth surface gets an extra Nginx-level rate limit in front of the app's own
    # express-rate-limit, as defense-in-depth.
    location /api/auth/ {
        limit_req zone=auth_zone burst=20 nodelay;
        proxy_pass $tejoma_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Phase D Item 1: Frontend extraction - nginx now serves the SPA directly from the built dist/
    # directory (PHASE D), removing that responsibility from the monolith. All /api/* routes still
    # proxy to the gateway as before.

    # Hashed Vite build assets (content-addressed filenames) are safe to cache aggressively.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff|woff2|ttf|ico)$ {
        root /app/dist;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # API routes - proxy to API Gateway for all /api/* paths.
    location /api/ {
        proxy_pass $tejoma_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA shell and routing - nginx serves index.html for all non-asset, non-API routes.
    # This allows the SPA router (React Router, Vue Router, etc.) to handle client-side routing.
    location / {
        root /app/dist;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=3600";
    }
}
