client_max_body_size 20m;

upstream tejoma_app {
    server app:3006;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# Port 80: redirect everything to HTTPS, except the ACME challenge path used
# by the real Let's Encrypt flow later, and a plain health endpoint for the
# Docker HEALTHCHECK (doesn't need TLS, isn't sensitive).
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    location = /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Port 443: TLS termination + reverse proxy to the Node app. Node already
# serves both the built SPA and /api/* from one process (unified deploy
# model), so this is a single upstream, not per-route splitting - no API
# routes are changed here, only proxied.
#
# Cert paths below are the self-signed dev cert generated by
# scripts/generate-dev-certs.sh. To switch to a real Let's Encrypt cert,
# point these two lines at /etc/letsencrypt/live/<domain>/fullchain.pem and
# privkey.pem instead (see DEPLOYMENT.md).
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SSE - must not be buffered, and needs a long-lived connection.
    location /api/realtime/stream {
        proxy_pass http://tejoma_app;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1d;
        chunked_transfer_encoding off;
        add_header X-Accel-Buffering no;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Routes that hit Gemini or one of the Python microservices and can legitimately take
    # longer than a typical API call - extended timeouts so a slow (not stuck) upstream call
    # doesn't get cut off by the proxy before the app itself responds or times out.
    location ~ ^/api/(parse-resume|jobs/parse-description|ml/train|chat)$ {
        proxy_pass http://tejoma_app;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Auth surface gets an extra Nginx-level rate limit in front of the app's own
    # express-rate-limit, as defense-in-depth.
    location /api/auth/ {
        limit_req zone=auth_zone burst=20 nodelay;
        proxy_pass http://tejoma_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed Vite build assets (content-addressed filenames) are safe to cache aggressively -
    # complements express.static()'s own headers rather than replacing them.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff|woff2|ttf|ico)$ {
        proxy_pass http://tejoma_app;
        proxy_http_version 1.1;
        add_header Cache-Control "public, max-age=31536000, immutable";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else - the SPA shell and the rest of /api/*.
    location / {
        proxy_pass http://tejoma_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
