{{- if not .Values.existingSecret }}
# Only rendered when no existingSecret is set (values.yaml's comment explains the two supported
# paths). Prefer existingSecret + AWS Secrets Manager via External Secrets Operator for real
# production use, per Phase 5(infrastructure) sections 7/15's already-decided approach.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dynamic-weighting-service.fullname" . }}-secrets
  labels:
    {{- include "dynamic-weighting-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
