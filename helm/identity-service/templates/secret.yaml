{{- if not .Values.existingSecret }}
# Only rendered when no existingSecret is set (values.yaml's comment explains the two supported
# paths). Helm records this manifest's rendered content (including these values) in its own
# release history (`helm get values`/`helm history`) - treat that release history with the same
# care as the secret itself, and prefer `existingSecret` + an out-of-band secret store (AWS
# Secrets Manager via External Secrets Operator) for real production use, per Phase
# 5(infrastructure) sections 7/15's already-decided approach.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "identity-service.fullname" . }}-secrets
  labels:
    {{- include "identity-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
