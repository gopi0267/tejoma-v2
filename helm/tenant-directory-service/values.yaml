# Default values for tenant-directory-service. See helm/identity-service/values.yaml's header
# comment for the two supported ways to supply secrets - identical pattern, applied here.

replicaCount: 2

image:
  repository: ""  # e.g. <account-id>.dkr.ecr.ap-south-1.amazonaws.com/tejoma-tenant-directory-service
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 4003

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

probes:
  liveness:
    path: /live
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

terminationGracePeriodSeconds: 30
preStopSleepSeconds: 5

config:
  NODE_ENV: production
  LOG_LEVEL: info
  DB_HOST: ""
  DB_PORT: "5432"
  DB_NAME: tejoma_tenant_directory
  DB_USER: tenant_directory_service
  FRONTEND_URL: ""

existingSecret: ""
secrets:
  DB_PASSWORD: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "4003"
  prometheus.io/path: /metrics

nodeSelector: {}
tolerations: []
affinity: {}
