apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "matching-scoring-service.fullname" . }}-config
  labels:
    {{- include "matching-scoring-service.labels" . | nindent 4 }}
data:
  PORT: "4021"
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
