# Default values for candidate-core-service. See helm/identity-service/values.yaml's header
# comment for the two supported ways to supply secrets - identical pattern, applied here.
#
# JWT_SECRET: this service now has a real, gateway-routed, staff-facing HTTP surface
# (remaining-monolith migration, Step 3a) - GET /api/candidates* is served from this service's own
# mirror; POST/DELETE proxy to the monolith (MONOLITH_INTERNAL_URL below), which stays the sole
# writer so every other still-monolith surface reading `candidates` directly keeps working.

replicaCount: 2

image:
  repository: ""  # e.g. <account-id>.dkr.ecr.ap-south-1.amazonaws.com/tejoma-candidate-core-service
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 4019

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

probes:
  liveness:
    path: /live
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

terminationGracePeriodSeconds: 30
preStopSleepSeconds: 5

config:
  NODE_ENV: production
  LOG_LEVEL: info
  DB_HOST: ""
  DB_PORT: "5432"
  DB_NAME: tejoma_candidate_core
  DB_USER: candidate_core_service
  FRONTEND_URL: ""
  # Required for the write proxy (create/delete/bulk-upload/import) - see config/env.ts's header comment.
  MONOLITH_INTERNAL_URL: ""

existingSecret: ""
secrets:
  DB_PASSWORD: ""
  # Same value as the monolith's own JWT_SECRET - this service verifies the exact staff token the
  # monolith issues today, not a JWKS-based one. Must match exactly, or every request will 401.
  JWT_SECRET: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "4019"
  prometheus.io/path: /metrics

nodeSelector: {}
tolerations: []
affinity: {}
