# Default values for job-service. See helm/identity-service/values.yaml's header
# comment for the two supported ways to supply secrets - identical pattern, applied here.
#
# JWT_SECRET: this service now has a real, gateway-routed, staff-facing HTTP surface
# (remaining-monolith migration, Step 4) - GET /api/jobs/:id is served from this service's own DB
# fused with candidate-core-service and matching-scoring-service; list/create/update/delete proxy
# to the monolith (MONOLITH_INTERNAL_URL below), which stays the sole writer so every other
# still-monolith surface reading `jobs` directly keeps working.

replicaCount: 2

image:
  repository: ""  # e.g. <account-id>.dkr.ecr.ap-south-1.amazonaws.com/tejoma-job-service
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 4018

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

probes:
  liveness:
    path: /live
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

terminationGracePeriodSeconds: 30
preStopSleepSeconds: 5

config:
  NODE_ENV: production
  LOG_LEVEL: info
  DB_HOST: ""
  DB_PORT: "5432"
  DB_NAME: tejoma_job
  DB_USER: job_service
  FRONTEND_URL: ""
  # Required for the write proxy (create/update/delete/list) - see config/env.ts's header comment.
  MONOLITH_INTERNAL_URL: ""
  # Required for GET /api/jobs/:id's real cutover fusion (candidate pool + ranked scoring).
  CANDIDATE_CORE_SERVICE_URL: ""
  MATCHING_SCORING_SERVICE_URL: ""

existingSecret: ""
secrets:
  DB_PASSWORD: ""
  # Same value as the monolith's own JWT_SECRET - this service verifies the exact staff token the
  # monolith issues today, not a JWKS-based one. Must match exactly, or every request will 401.
  JWT_SECRET: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "4018"
  prometheus.io/path: /metrics

nodeSelector: {}
tolerations: []
affinity: {}
