# Default values for jd-parser-service. See helm/identity-service/values.yaml's header comment
# for the two supported ways to supply secrets - identical pattern, applied here.

replicaCount: 2

image:
  repository: ""  # e.g. <account-id>.dkr.ecr.ap-south-1.amazonaws.com/tejoma-jd-parser-service
  tag: ""
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 4004

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

probes:
  liveness:
    path: /live
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

terminationGracePeriodSeconds: 30
preStopSleepSeconds: 5

config:
  NODE_ENV: production
  LOG_LEVEL: info
  FRONTEND_URL: ""
  # Optional and gracefully-degrading (src/jd-parser/tiers/nlpTier.ts) - a down/unset NLP service
  # must never break JD parsing. No Kubernetes Service for jd-nlp-service exists yet (it's only
  # ever run via docker-compose today - docker-compose.yml's header comment) - leave unset until
  # jd-nlp-service itself is deployed to the cluster, then point this at its ClusterIP Service.
  JD_NLP_SERVICE_URL: ""

existingSecret: ""
secrets:
  # Same value as the monolith's own JWT_SECRET (config/env.ts's header comment - this service
  # verifies the exact token the monolith issues today, not a JWKS-based one). Must match exactly,
  # or every request will 401.
  JWT_SECRET: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "4004"
  prometheus.io/path: /metrics

nodeSelector: {}
tolerations: []
affinity: {}
