apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: tejoma
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: 'tejoma-production'
        environment: 'production'

    # Alerting configuration
    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager.tejoma.svc.cluster.local:9093

    # Alert rules
    rule_files:
      - '/etc/prometheus/alert-rules.yml'

    scrape_configs:
      # Prometheus self-monitoring
      - job_name: 'prometheus'
        scrape_interval: 5s
        static_configs:
          - targets: ['localhost:9090']

      # Kubernetes API server
      - job_name: 'kubernetes-apiservers'
        kubernetes_sd_configs:
          - role: endpoints
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https

      # Kubernetes nodes
      - job_name: 'kubernetes-nodes'
        kubernetes_sd_configs:
          - role: node
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token

      # Tejoma services (via ServiceMonitor)
      - job_name: 'tejoma-services'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - tejoma
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: 'true'
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name

      # Node Exporter
      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: endpoints
        relabel_configs:
          - source_labels: [__meta_kubernetes_endpoints_name]
            regex: 'node-exporter'
            action: keep

      # kube-state-metrics
      - job_name: 'kube-state-metrics'
        static_configs:
          - targets: ['kube-state-metrics.kube-system.svc.cluster.local:8080']

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
  namespace: tejoma
data:
  alert-rules.yml: |
    groups:
      - name: tejoma_alerts
        interval: 30s
        rules:
          # Service availability
          - alert: ServiceDown
            expr: up{job="tejoma-services"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Service {{ $labels.kubernetes_pod_name }} is down"
              description: "Service {{ $labels.kubernetes_pod_name }} has been down for 2 minutes"

          # High error rate
          - alert: HighErrorRate
            expr: |
              (sum(rate(http_requests_total{status=~"5.."}[5m])) by (kubernetes_pod_name) /
               sum(rate(http_requests_total[5m])) by (kubernetes_pod_name)) > 0.05
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High error rate in {{ $labels.kubernetes_pod_name }}"
              description: "Error rate is {{ $value | humanizePercentage }}"

          # High latency
          - alert: HighLatency
            expr: |
              histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, kubernetes_pod_name)) > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High P99 latency in {{ $labels.kubernetes_pod_name }}"
              description: "P99 latency is {{ $value }}s"

          # High memory usage
          - alert: HighMemoryUsage
            expr: |
              (container_memory_usage_bytes{pod_name=~"tejoma-.*"} /
               container_spec_memory_limit_bytes{pod_name=~"tejoma-.*"}) > 0.85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage in {{ $labels.pod_name }}"
              description: "Memory usage is {{ $value | humanizePercentage }}"

          # High CPU usage
          - alert: HighCPUUsage
            expr: |
              (sum(rate(container_cpu_usage_seconds_total{pod_name=~"tejoma-.*"}[5m])) by (pod_name) /
               sum(container_spec_cpu_quota{pod_name=~"tejoma-.*"}) by (pod_name)) > 0.85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage in {{ $labels.pod_name }}"
              description: "CPU usage is {{ $value | humanizePercentage }}"

          # Database connection pool exhaustion
          - alert: DBConnectionPoolNearExhaustion
            expr: |
              (sum(db_pool_active_connections) by (service) /
               sum(db_pool_max_connections) by (service)) > 0.85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "DB connection pool near exhaustion in {{ $labels.service }}"
              description: "Active connections: {{ $value | humanizePercentage }}"

          # Cutover flag misconfiguration
          - alert: CutoverFlagMismatch
            expr: |
              count(count by (cutover_flag) (cutover_enabled)) != 1
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Cutover flags are not consistent across services"
              description: "Different services have different cutover flag values"
