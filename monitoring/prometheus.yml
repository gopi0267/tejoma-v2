  - job_name: 'dynamic-weighting-service'
    static_configs:
      - targets: ['dynamic-weighting-service:4017']

  - job_name: 'job-service'
    static_configs:
      - targets: ['job-service:4018']

  - job_name: 'candidate-core-service'
    static_configs:
      - targets: ['candidate-core-service:4019']

  - job_name: 'matching-decision-service'
